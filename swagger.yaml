openapi: 3.0.3
info:
  title: Eventful API
  version: 2.0.0
  description: PostgreSQL and Supabase Auth edition of the Eventful ticketing API.
servers:
  - url: http://localhost:5001/api/v2
    description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EventInput:
      type: object
      required: [title, description, date, location, price, capacity]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string }
        date: { type: string, format: date-time }
        location: { type: string, maxLength: 240 }
        price: { type: number, minimum: 0, description: Price in naira }
        capacity: { type: integer, minimum: 1 }
        reminderHoursBefore:
          type: array
          maxItems: 5
          items: { type: number, minimum: 0, exclusiveMinimum: true }
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register and send a confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [creator, eventee], default: eventee }
      responses:
        '201': { description: Confirmation email sent; no login token is returned }
        '409': { description: Email already registered }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login after email confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Access and refresh tokens returned }
        '403': { description: Email has not been confirmed }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Session refreshed }
  /auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend a signup confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Non-enumerating response returned }
  /events:
    get:
      tags: [Events]
      summary: Browse paginated events (Redis cached)
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: upcoming, schema: { type: boolean, default: true } }
      responses:
        '200': { description: Paginated events }
    post:
      tags: [Events]
      summary: Create an event and optional creator reminders
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201': { description: Event created }
        '403': { description: Creator role required }
  /events/mine:
    get:
      tags: [Events]
      summary: List events owned by the creator
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Creator events }
  /events/{id}:
    get:
      tags: [Events]
      summary: Get an event
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Event }
        '404': { description: Event not found }
  /events/{id}/share:
    get:
      tags: [Events]
      summary: Generate social share links
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Share links }
  /events/{id}/attendees:
    get:
      tags: [Events]
      summary: List an owned event's attendees and scan status
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Attendees }
  /tickets/buy/{eventId}:
    post:
      tags: [Tickets]
      summary: Issue a free ticket or initialize Paystack
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Paystack checkout initialized }
        '201': { description: Free ticket issued }
        '409': { description: Sold out or ticket already owned }
  /tickets/verify/{reference}:
    post:
      tags: [Tickets]
      summary: Verify amount, currency, owner, and issue a paid ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string } }
      responses:
        '201': { description: Ticket issued idempotently }
  /tickets/scan/{token}:
    post:
      tags: [Tickets]
      summary: Admit an attendee using the opaque QR token
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: token, required: true, schema: { type: string } }
      responses:
        '200': { description: Ticket admitted exactly once }
        '409': { description: Ticket was already scanned }
  /tickets/my-tickets:
    get:
      tags: [Tickets]
      summary: List the eventee's tickets
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tickets }
  /tickets/{ticketId}/reminder:
    post:
      tags: [Notifications]
      summary: Schedule a personal reminder
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: ticketId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hoursBefore]
              properties:
                hoursBefore: { type: number, exclusiveMinimum: 0 }
      responses:
        '201': { description: Reminder persisted and queued }
  /payments/history:
    get:
      tags: [Payments]
      summary: Get the creator's paid transaction ledger
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Payment ledger }
  /analytics/global:
    get:
      tags: [Analytics]
      summary: Get all-time creator metrics
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ticket, attendance, and revenue metrics }
  /analytics/events/{eventId}:
    get:
      tags: [Analytics]
      summary: Get metrics for one owned event
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: eventId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Per-event metrics }
